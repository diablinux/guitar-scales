name: Deploy Fretboard Diagrams to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate HTML report
        run: python guitar_scales.py

      # --- MODIFICATION: Create a directory and move the artifact into it ---
      - name: Create Staging Directory and Move Artifact
        run: |
          mkdir -p _site
          mv all_notes_all_modes.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # --- MODIFICATION: Point the 'path' to the newly created directory ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The path must be a directory.
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4